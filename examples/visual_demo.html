<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Agent Resilience | Circuit breaker demo</title>
<style>
:root{color-scheme:dark;--blue:#005EFF;--ink:#000;--text:#edf2fa;--muted:#a2afc4;--line:#18263b}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:16px/1.65 system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:32px 32px 56px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;gap:20px}
a{color:var(--text);text-underline-offset:5px}a:hover{color:var(--blue)}.brand{font-weight:650;letter-spacing:.02em}.brand span{color:var(--blue)}
button{font:inherit;color:var(--text);background:rgba(0,94,255,.12);border:1px solid rgba(0,94,255,.5);border-radius:9px;padding:10px 18px;cursor:pointer}
button:hover{background:rgba(0,94,255,.23);box-shadow:0 0 22px rgba(0,94,255,.12)}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:5px}button:disabled{opacity:.4;cursor:default}
.hero{padding:44px 0 30px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin:0 0 14px}
h1{font-size:clamp(28px,4vw,46px);line-height:1.15;letter-spacing:-.035em;margin:0 0 18px;max-width:800px}h2{font-size:22px;line-height:1.25;margin:0 0 14px}
p{margin:0 0 12px}.intro{color:var(--muted);max-width:760px}.flow{display:flex;align-items:center;gap:16px;padding:20px 0 28px;font:13px ui-monospace,monospace;color:var(--muted)}.flow span{padding:8px 12px;border:1px solid var(--line);border-radius:6px}.flow .active{color:var(--text);border-color:var(--blue);background:rgba(0,94,255,.1)}.flow b{color:var(--blue)}
.panel{border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:14px;background:linear-gradient(135deg,rgba(0,94,255,.055),rgba(0,0,0,.9));padding:28px;box-shadow:0 12px 50px rgba(0,94,255,.05)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.badge{font:13px ui-monospace,monospace;border:1px solid var(--blue);padding:6px 12px;border-radius:6px;color:var(--text)}.step{font:12px ui-monospace,monospace;color:var(--muted)}
.observation{min-height:112px}.observation p{color:var(--muted);max-width:760px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;border-top:1px solid var(--line);padding-top:22px;margin-top:20px}.metrics strong{display:block;font:32px ui-monospace,monospace;color:var(--text)}.metrics span{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.primary{background:rgba(0,94,255,.75);border-color:var(--blue)}.progress{height:2px;background:var(--line);margin-top:24px}.progress i{display:block;height:100%;background:var(--blue);width:0}
.details{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:36px}.details h2{font-size:17px}.details p{font-size:14px;color:var(--muted)}code{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;color:var(--text)}.command{border:1px solid var(--line);padding:14px;border-radius:8px;background:#000}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}summary{cursor:pointer;color:var(--muted)}.table-scroll{overflow-x:auto;margin-top:16px}table{border-collapse:collapse;width:100%;font:12px/1.8 ui-monospace,monospace;text-align:left;white-space:nowrap}td,th{border-bottom:1px solid var(--line);padding:8px}th{color:var(--muted);font-weight:400}tr.current{background:rgba(0,94,255,.13)}footer{margin-top:28px;font-size:12px;color:var(--muted)}
@media(max-width:600px){main{padding:20px 18px 36px}.hero{padding-top:30px}.flow{gap:8px;font-size:11px}.flow span{padding:7px 8px}.panel{padding:20px}.metrics{gap:12px}.metrics strong{font-size:27px}.details{grid-template-columns:1fr;gap:20px}.observation{min-height:156px}.controls button{padding:9px 12px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<header><div class="brand"><span>●</span> Agent Resilience</div><button id="language" type="button">English</button></header>
<section class="hero"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="intro" data-i18n="intro"></p></section>
<div class="flow" aria-label="Circuit breaker states"><span data-state="closed">CLOSED</span><b>→</b><span data-state="open">OPEN</span><b>→</b><span data-state="half_open">HALF_OPEN</span></div>
<section class="panel" aria-label="Recorded execution replay">
<div class="topline"><span class="badge" id="state">CLOSED</span><span class="step" id="step"></span></div>
<div class="observation" aria-live="polite" aria-atomic="true"><h2 id="heading"></h2><p id="explanation"></p></div>
<div class="metrics"><div><strong id="attempts">0</strong><span data-i18n="attempts"></span></div><div><strong id="calls">0</strong><span data-i18n="calls"></span></div><div><strong id="blocked">0</strong><span data-i18n="blocked"></span></div></div>
<div class="controls"><button class="primary" id="play" type="button"></button><button id="next" type="button" data-i18n="next"></button><button id="restart" type="button" data-i18n="restart"></button></div>
<div class="progress" aria-hidden="true"><i id="progress"></i></div>
</section>
<section class="details"><div><h2 data-i18n="observedTitle"></h2><p data-i18n="observed"></p><a href="https://github.com/Musyg/agent-resilience/blob/main/agent_resilience/circuit_breaker.py" data-i18n="source"></a></div><div><h2 data-i18n="reproduce"></h2><p data-i18n="instructions"></p><div class="command"><code>python -m examples.visual_demo --output demo-output</code></div></div></section>
<details><summary data-i18n="trace"></summary><div class="table-scroll"><table><thead><tr><th>#</th><th data-i18n="time"></th><th>State</th><th>Outcome</th><th data-i18n="calls"></th></tr></thead><tbody id="rows"></tbody></table></div></details>
<footer id="provenance"></footer>
</main>
<script id="recorded-trace" type="application/json">__RECORDED_TRACE__</script>
<script>
'use strict';
const trace = JSON.parse(document.getElementById('recorded-trace').textContent);
const copy = {
fr:{eyebrow:'Démonstration technique / circuit breaker',title:'Quand une dépendance tombe.',intro:'Trois échecs ouvrent le circuit. Les appels suivants sont bloqués. Après le délai de récupération, une sonde réussie rétablit le flux.',attempts:'Tentatives',calls:'Appels à la dépendance',blocked:'Appels bloqués',play:'Lire la démo',pause:'Pause',next:'Étape suivante',restart:'Recommencer',observedTitle:'Ce que montre cette exécution',observed:'Dépendance locale simulée, circuit breaker exécuté en Python. Seuil : 3 échecs. Délai : 2 secondes. Cette vue rejoue les états et compteurs enregistrés, à un rythme de lecture.',source:'Lire le code du circuit breaker',reproduce:'Reproduire',instructions:'Depuis un clone du dépôt, avec Python 3.11 ou plus. Aucun serveur ni clé API nécessaire. Ouvrir ensuite demo-output/index.html.',trace:'Voir la trace complète',time:'Temps mesuré',recorded:'Enregistré',version:'Version',step:'Étape'},
en:{eyebrow:'Technical demonstration / circuit breaker',title:'When a dependency goes down.',intro:'Three failures open the circuit. Further calls are blocked. After the recovery timeout, a successful probe restores the flow.',attempts:'Attempts',calls:'Upstream calls',blocked:'Blocked calls',play:'Play demo',pause:'Pause',next:'Next step',restart:'Restart',observedTitle:'What this execution shows',observed:'Simulated local dependency, circuit breaker executed in Python. Threshold: 3 failures. Timeout: 2 seconds. This view replays recorded states and counters at a readable pace.',source:'Read the circuit breaker code',reproduce:'Reproduce',instructions:'From a repository clone, with Python 3.11 or later. No server or API key required. Then open demo-output/index.html.',trace:'View the full trace',time:'Measured time',recorded:'Recorded',version:'Version',step:'Step'}
};
const captions = {
fr:{initial:['Le circuit est fermé.','La dépendance est disponible. Les appels peuvent passer.'],healthy:['Un premier appel réussit.','La dépendance a été appelée une fois. Le circuit reste fermé.'],failure:['La dépendance ne répond plus.','Chaque échec est compté. Au troisième, le circuit passe à OPEN.'],isolation:['Le circuit bloque les appels.','La demande est rejetée avant de contacter la dépendance. Son compteur d’appels ne bouge pas.'],cooldown:['Le délai de récupération commence.','Le circuit reste ouvert pendant 2 secondes. Aucun reset manuel n’est utilisé.'],probe:['Une sonde est autorisée.','Le délai est écoulé. Le circuit passe à HALF_OPEN avant l’appel de reprise.'],recovery:['La sonde réussit.','La dépendance répond à nouveau. Le circuit se referme et le compteur d’échecs est remis à zéro.'],resumed:['Le flux a repris.','8 tentatives, 6 appels à la dépendance, 2 appels bloqués. Le dernier appel passe normalement.']},
en:{initial:['The circuit is closed.','The dependency is available. Requests can pass through.'],healthy:['The first call succeeds.','The dependency has been called once. The circuit stays closed.'],failure:['The dependency is unavailable.','Each failure is counted. The third failure opens the circuit.'],isolation:['The circuit blocks requests.','The request is rejected before contacting the dependency. Its call counter does not change.'],cooldown:['The recovery timeout starts.','The circuit stays open for 2 seconds. No manual reset is used.'],probe:['A probe is allowed.','The timeout has elapsed. The circuit enters HALF_OPEN before the recovery call.'],recovery:['The probe succeeds.','The dependency responds again. The circuit closes and the failure counter resets.'],resumed:['Normal flow resumes.','8 attempts, 6 upstream calls, 2 blocked calls. The final request passes normally.']}
};
let language = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
let position = 0, timer = null;
const byId = id => document.getElementById(id);
function pause(){if(timer !== null)clearInterval(timer);timer=null;}
function render(){
 const event = trace.events[position], words = copy[language];
 document.documentElement.lang = language;
 document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = words[el.dataset.i18n]);
 byId('language').textContent = language === 'fr' ? 'English' : 'Français';
 byId('state').textContent = event.state.toUpperCase();
 byId('step').textContent = `${words.step} ${position+1}/${trace.events.length} · ${event.elapsed_s.toFixed(2)} s`;
 const caption = captions[language][event.phase];
 byId('heading').textContent = caption[0]; byId('explanation').textContent = caption[1];
 byId('attempts').textContent=event.attempts;byId('calls').textContent=event.upstream_calls;byId('blocked').textContent=event.blocked;
 document.querySelectorAll('[data-state]').forEach(el => el.classList.toggle('active',el.dataset.state === event.state));
 byId('progress').style.width = `${position/(trace.events.length-1)*100}%`;
 byId('play').textContent = timer === null ? words.play : words.pause;
 byId('next').disabled = position === trace.events.length-1;
 byId('provenance').textContent=`${words.recorded} ${trace.recorded_at} · Python · ${words.version} ${trace.library_version}`;
 byId('rows').replaceChildren(...trace.events.map((item,index) => {
  const row=document.createElement('tr');row.classList.toggle('current',index===position);
  [index+1,item.elapsed_s.toFixed(3)+' s',item.state,item.outcome,item.upstream_calls].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});return row;
 }));
}
byId('play').addEventListener('click',()=>{
 if(timer!==null){pause();render();return;}
 if(position===trace.events.length-1)position=0;
 timer=setInterval(()=>{position++;if(position===trace.events.length-1)pause();render();},1800);render();
});
byId('next').addEventListener('click',()=>{pause();position=Math.min(position+1,trace.events.length-1);render();});
byId('restart').addEventListener('click',()=>{pause();position=0;render();});
byId('language').addEventListener('click',()=>{language=language==='fr'?'en':'fr';render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();render();}});
render();
</script>
</body>
</html>
