en:{initial:['The circuit is closed.','The dependency is available. Requests can pass through.'],healthy:['The first call succeeds.','The dependency has been called once. The circuit stays closed.'],failure:['The dependency is unavailable.','Each failure is counted. The third failure opens the circuit.'],isolation:['The circuit blocks requests.','The request is rejected before contacting the dependency. Its call counter does not change.'],cooldown:['The recovery timeout starts.','The circuit stays open for 2 seconds. No manual reset is used.'],probe:['A probe is allowed.','The timeout has elapsed. The circuit enters HALF_OPEN before the recovery call.'],recovery:['The probe succeeds.','The dependency responds again. The circuit closes and the failure counter resets.'],resumed:['Normal flow resumes.','8 attempts, 6 upstream calls, 2 blocked calls. The final request passes normally.']}

dlq:{fr:{eyebrow:'Démonstration technique / file d’échecs',title:'Relancer une tâche en échec.',intro:'Une tâche échoue, est retentée puis mise de côté dans la DLQ. Après inspection, la même tâche est relancée et termine son traitement.',attempts:'En attente',calls:'En traitement',blocked:'En DLQ',observed:'DLQQueue exécutée en Python avec un adaptateur Redis en mémoire. La trace suit la même tâche et ses données, sur deux échecs puis une relance réussie.',source:'Lire le code de la file DLQ'},en:{eyebrow:'Technical demonstration / dead-letter queue',title:'Retry a failed task.',intro:'A task fails, is retried, then moves to the DLQ. After inspection, the same task is replayed and completes.',attempts:'Queued',calls:'Processing',blocked:'In the DLQ',observed:'DLQQueue executed in Python with an in-memory Redis adapter. The trace follows the same task and its data through two failures and a successful replay.',source:'Read the DLQ code'}},

let language = 'fr', scenarioId = 'circuit', position = 0, timer = null;
let speed = 1;
const byId = id => document.getElementById(id);
function readLocation(){
 const query=new URLSearchParams(location.search);
 language=query.get('lang')==='en'?'en':'fr';
 scenarioId=Object.hasOwn(scenarios,query.get('scenario'))?query.get('scenario'):(Object.hasOwn(scenarios,'circuit')?'circuit':Object.keys(scenarios)[0]);
 const step=query.get('step');
 const parsed=step!==null && /^\d+$/.test(step)?Number(step):1;
 position=Math.max(0,Math.min(Number.isSafeInteger(parsed)?parsed-1:0,scenarios[scenarioId].events.length-1));
}
function syncLocation(mode='push'){
 const url=new URL(location.href);
 url.searchParams.set('lang',language);url.searchParams.set('scenario',scenarioId);url.searchParams.set('step',String(position+1));
 if(url.href!==location.href)history[mode==='replace'?'replaceState':'pushState'](null,'',url);
}
function formatElapsed(seconds){
 const milliseconds = seconds * 1000;
 const number = new Intl.NumberFormat(language==='fr'?'fr-FR':'en-US',{minimumFractionDigits:3,maximumFractionDigits:3,useGrouping:false});
 return (milliseconds>0 && milliseconds<0.001 ? '< '+number.format(0.001) : number.format(milliseconds))+' ms';
}
function pause(){if(timer !== null)clearInterval(timer);timer=null;}
function selectStep(index){const focused=document.activeElement;const container=focused?.closest('#timeline,#rows')?.id;pause();position=Math.max(0,Math.min(index,scenarios[scenarioId].events.length-1));syncLocation();render();if(container)byId(container).querySelector(`[data-step="${position}"]`)?.focus({preventScroll:true});}
function start(){
 timer=setInterval(()=>{position=Math.min(position+1,scenarios[scenarioId].events.length-1);if(position===scenarios[scenarioId].events.length-1)pause();syncLocation('replace');render();},1800/speed);
}
function outcome(selected,words){
 const last=selected.events[selected.events.length-1], fr=language==='fr';
 if(scenarioId==='circuit')return fr?`${last.attempts} tentatives, ${last.upstream_calls} appels à la dépendance, ${last.blocked} appels bloqués. État final : ${last.state.toUpperCase()}.`:`${last.attempts} attempts, ${last.upstream_calls} upstream calls, ${last.blocked} blocked calls. Final state: ${last.state.toUpperCase()}.`;
 if(scenarioId==='dlq')return fr?`${last.job.id} : ${last.state==='completed'?'traitement terminé':'état '+last.state}, après ${last.worker_calls} essais. Même identifiant et mêmes données tout au long du parcours.`:`${last.job.id}: ${last.state==='completed'?'processing completed':'state '+last.state}, after ${last.worker_calls} worker attempts. The same ID and payload throughout the run.`;
 const sequence=last.messages.map(message=>message.payload.sequence).join(' → ');
 return fr?`${last.published_count}/${last.produced} appels publish enregistrés par le client local (${sequence}). ${last.buffered} message en tampon à la fin.`:`${last.published_count}/${last.produced} publish calls recorded by the local client (${sequence}). ${last.buffered} messages buffered at the end.`;
}
function journey(event,words){
 const nodes=[];
 function card(title,detail,active=false,blocked=false,tokens=[]){const node=document.createElement('div');node.className='journey-item';node.classList.toggle('active',active);node.classList.toggle('blocked',blocked);const heading=document.createElement('strong');heading.textContent=title;const text=document.createElement('small');text.textContent=detail;node.append(heading,text);tokens.forEach(value=>{const token=document.createElement('span');token.className='token';token.textContent=value;node.append(token);});nodes.push(node);}
 if(scenarioId==='circuit'){
  card(words.request,`${words.attempts}: ${event.attempts}`,event.called || event.outcome==='blocked');
  card(words.gate,event.outcome==='blocked'?words.blockedHere:event.state.toUpperCase(),true,event.outcome==='blocked');
  card(words.dependency,event.outcome==='blocked'?words.notCalled:event.called?words.callRecorded:words.noCall,event.called);
 }else if(scenarioId==='dlq'){
  const labels={queued:words.queue,processing:words.processing,dlq:words.quarantine,completed:words.completed};
  ['queued','processing','dlq','completed'].forEach(state=>card(labels[state],event.state===state?event.job.id:'',event.state===state,false,event.state===state?[`${words.retries}: ${event.retry_count}`,`${words.workerCalls}: ${event.worker_calls}`]:[]));
  const payload=document.createElement('p');payload.className='journey-note';payload.textContent=`${words.payload}: ${JSON.stringify(event.job.payload)}`;nodes.push(payload);
 }else{
  const published=new Set(event.messages.map(message=>message.payload.sequence));
  [1,2,3].forEach(sequence=>{const produced=sequence<=event.produced;const sent=published.has(sequence);const buffered=produced&&!sent&&event.buffered>0;const status=!produced?words.notProduced:sent?words.publishedMessage:buffered?words.bufferedMessage:words.inFlight;card(`Message ${sequence}`,status,produced,false,[sent?words.client:buffered?words.buffer:produced?words.flusher:''].filter(Boolean));});
 }
 byId('journey').replaceChildren(...nodes);byId('journey').setAttribute('aria-label',words.journeyLabel);
}
function comparison(words){
 const data=trace.comparisons?.circuit;
 const valid=data && ['baseline','protected'].every(mode=>data[mode]?.summary && ['attempts','upstream_calls','failures','successes','blocked'].every(key=>Number.isFinite(data[mode].summary[key])));
 byId('comparison').hidden=scenarioId!=='circuit'||!valid;
 if(!valid)return;
 ['baseline','protected'].forEach(mode=>{const nodes=['attempts','upstream_calls','failures','successes','blocked'].map(key=>{const node=document.createElement('div');const label=document.createElement('dt');const value=document.createElement('dd');label.textContent=words[{upstream_calls:'calls'}[key]||key];value.textContent=data[mode].summary[key];value.dataset.run=mode;value.dataset.metric=key;node.append(label,value);return node;});byId('comparison-'+mode).replaceChildren(...nodes);});
}
function render(){
 const selected = scenarios[scenarioId], event = selected.events[position];
 const words = {...copy[language],...(scenarioCopy[scenarioId]?.[language] || {})};
 document.documentElement.lang = language;
 document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = words[el.dataset.i18n]);
 byId('language').textContent = language === 'fr' ? 'English' : 'Français';
 byId('back-to-project').href=language==='fr'?'/fr/realisations/agent-resilience/':'/work/agent-resilience/';
 byId('replay').setAttribute('aria-label',words.replayLabel);
 byId('timeline').setAttribute('aria-label',words.timelineLabel);
 byId('scenario-nav').setAttribute('aria-label',language === 'fr' ? 'Scénarios' : 'Scenarios');
 document.querySelectorAll('[data-scenario]').forEach(button=>{
  button.disabled = !Object.hasOwn(scenarios,button.dataset.scenario);
  button.setAttribute('aria-pressed',String(button.dataset.scenario===scenarioId));
 });
 const states = {circuit:['closed','open','half_open'],dlq:['queued','processing','dlq','completed'],mqtt:['offline','buffered','connected']}[scenarioId];
 const flow = [];
 states.forEach((state,index)=>{if(index){const arrow=document.createElement('b');arrow.textContent='→';arrow.setAttribute('aria-hidden','true');flow.push(arrow);}const node=document.createElement('span');node.dataset.state=state;node.textContent=state.toUpperCase();flow.push(node);});
 byId('flow').replaceChildren(...flow);
 byId('flow').setAttribute('aria-label',language === 'fr' ? 'États observés' : 'Observed states');
 byId('state').textContent = event.state.toUpperCase();
 byId('step').textContent = `${words.step} ${position+1}/${selected.events.length} · ${words.executionTime}: ${formatElapsed(event.elapsed_s)}`;
 byId('step').title = language==='fr'?'Temps écoulé depuis le début de l’exécution':'Elapsed time since execution started';
 const caption = scenarioId === 'circuit' ? captions[language][event.phase] : extraCaptions[scenarioId][language][event.phase];
 byId('heading').textContent = caption[0]; byId('explanation').textContent = caption[1];
 journey(event,words);
 byId('outcome-summary').textContent=outcome(selected,words);
 byId('result').hidden=position!==selected.events.length-1;
 byId('result').textContent=outcome(selected,words);
 const metrics = scenarioId === 'circuit' ? [event.attempts,event.upstream_calls,event.blocked] : scenarioId === 'dlq' ? [event.queue_size,event.processing,event.dlq_size] : [event.buffered,event.published_count,event.produced];
 ['attempts','calls','blocked'].forEach((id,index)=>byId(id).textContent=metrics[index]);
 document.querySelectorAll('[data-state]').forEach(el => el.classList.toggle('active',el.dataset.state === event.state));
 byId('progress').style.width = `${position/(selected.events.length-1)*100}%`;
 byId('play').textContent = timer === null ? words.play : words.pause;
 byId('previous').disabled = position === 0;
 byId('next').disabled = position === selected.events.length-1;
 byId('speed').value=String(speed);
 byId('timeline').replaceChildren(...selected.events.map((item,index)=>{const button=document.createElement('button');button.type='button';button.dataset.step=String(index);button.textContent=String(index+1);const caption=scenarioId==='circuit'?captions[language][item.phase]:extraCaptions[scenarioId][language][item.phase];button.setAttribute('aria-label',`${words.step} ${index+1}: ${caption[0]}`);if(index===position)button.setAttribute('aria-current','step');button.addEventListener('click',()=>selectStep(index));return button;}));
 const files={circuit:'circuit_breaker.py',dlq:'dlq.py',mqtt:'mqtt_buffer.py'};
 const sourceRevision='9d2254d54ff66be5ed627a5385155a5a6e58f32d';
 byId('source').href='https://github.com/Musyg/agent-resilience/blob/'+sourceRevision+'/agent_resilience/'+files[scenarioId];
 byId('trace-metric').textContent=scenarioId==='dlq' ? (language==='fr'?'Compteur d’échecs':'Failure count') : words.calls;
 const provenance=trace.provenance;
 const details=[`Python${provenance?.python_version?' '+provenance.python_version:''}`];
 if(provenance?.source_revision)details.push(`${words.revision}: ${provenance.source_revision.slice(0,12)}${provenance.source_dirty?' ('+words.workingTree+')':''}`);
 if(provenance?.platform)details.push(`${words.environment}: ${provenance.platform}`);
 if(selected.source_sha256)details.push(`${words.sourceHash}: ${selected.source_sha256}`);
 const cleanRevision=provenance?.source_dirty===false && /^[0-9a-f]{40}$/.test(provenance.source_revision||'');
 const provenanceLine=document.createElement('p');provenanceLine.textContent=`${words.recorded} ${selected.recorded_at} · ${words.version} ${trace.library_version}`;
 const technical=document.createElement('details'),technicalLabel=document.createElement('summary'),technicalText=document.createElement('p');technicalLabel.textContent=language==='fr'?'Détails de la capture':'Capture details';technicalText.textContent=details.join(' · ');technical.append(technicalLabel,technicalText);
 if(cleanRevision){const captureLink=document.createElement('a');captureLink.id='capture-source';captureLink.href=`https://github.com/Musyg/agent-resilience/blob/${provenance.source_revision}/examples/visual_demo.py`;captureLink.textContent=language==='fr'?'Lire le code de cette capture':'Read the code for this capture';technical.append(captureLink);}
 byId('provenance').replaceChildren(provenanceLine,technical);
 byId('reproduction-command').textContent=cleanRevision?`git checkout ${provenance.source_revision}\npython -m examples.visual_demo --output demo-output`:'python -m examples.visual_demo --output demo-output';
 comparison(words);
 byId('rows').replaceChildren(...selected.events.map((item,index) => {
  const row=document.createElement('tr');row.classList.toggle('current',index===position);
  const detail=scenarioId==='circuit'?item.upstream_calls:scenarioId==='dlq'?item.retry_count:item.published_count;
  const stepCell=document.createElement('td'),button=document.createElement('button');button.type='button';button.className='trace-select';button.dataset.step=String(index);button.textContent=String(index+1);button.setAttribute('aria-label',`${words.step} ${index+1}`);if(index===position)button.setAttribute('aria-current','step');button.addEventListener('click',()=>selectStep(index));stepCell.append(button);row.append(stepCell);
  [formatElapsed(item.elapsed_s),item.state,item.outcome,detail].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});return row;
 }));
}
byId('play').addEventListener('click',()=>{
 if(timer!==null){pause();render();return;}
 if(position===scenarios[scenarioId].events.length-1)position=0;
 syncLocation();start();render();
});
byId('previous').addEventListener('click',()=>selectStep(position-1));
byId('next').addEventListener('click',()=>selectStep(position+1));
byId('restart').addEventListener('click',()=>selectStep(0));
byId('language').addEventListener('click',()=>{language=language==='fr'?'en':'fr';syncLocation();render();});
byId('speed').addEventListener('change',()=>{const nextSpeed=Number(byId('speed').value);if(![0.5,1,2].includes(nextSpeed))return;speed=nextSpeed;const playing=timer!==null;pause();if(playing)start();render();});
document.querySelectorAll('[data-scenario]').forEach(button=>button.addEventListener('click',()=>{if(Object.hasOwn(scenarios,button.dataset.scenario)){pause();scenarioId=button.dataset.scenario;position=0;syncLocation();render();}}));
window.addEventListener('popstate',()=>{pause();readLocation();syncLocation('replace');render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();render();}});
readLocation();syncLocation('replace');
render();
</script>
